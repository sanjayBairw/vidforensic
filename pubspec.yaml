name: vidforensic
description: "VidForensic - Video Forensic Analyzer Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  file_picker: ^8.0.0
  video_player: ^2.8.2
  path_provider: ^2.1.2
  open_filex: ^4.4.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true




flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 21
  ios: true
  image_path: "assets/icons/logo.png"
  
  

